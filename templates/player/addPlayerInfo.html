{{define "player/addPlayerInfo.html"}}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加球员数据</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .navbar {
            background-color: #007bff;
        }
        .carousel-inner img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .about, .news {
            background-color: #f8f9fa;
            padding: 2rem;
        }
        .news-item {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 1rem;
        }
        footer {
            background-color: #007bff;
            color: white;
        }
        .form-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-container h1 {
            text-align: center;
        }
        .form-container form {
            display: flex;
            flex-direction: column;
        }
        .form-container label {
            margin-bottom: 0.5rem;
        }
        .form-container input {
            margin-bottom: 1rem;
        }
        .form-container button {
            align-self: center;
        }
    </style>
    <script>
        // 页面加载时动态设置Token
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token'); // 从localStorage读取Token
            if (token) {
                // 将Token添加到全局变量或隐藏字段中
                document.getElementById('token-field').value = token;
            } else {
                alert('Token不存在请先登录');
                window.location.href = '/index/login'; // 跳转到登录页面
            }
        });
    </script>
</head>
<body>
    <!-- 头部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="/index/index">
            <img src="logo.png" alt="Football Club Logo" height="30">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/play/play">添加球员能力信息</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/play/analynse">分析球员能力</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/index/index">返回</a>
                </li>
            </ul>
        </div>
    </nav>

    <h1>添加球员数据</h1>
    <form id="addmemberInfoForm" action="/play" method="GET">
        <label for="name">球员姓名：</label>
        <input type="text" id="name" name="name"><br><br>
        <button type="submit">添加</button>
    </form>
    <div class="form-container">
        <h2>球员数据条形图：</h2>
        <img id="playerImage" src="" alt="Player Image">
    </div>
</body>
<script>
    document.getElementById('addmemberInfoForm').addEventListener('submit', function(event) {
        event.preventDefault(); // 阻止表单默认提交行为

        // 获取表单数据
        const formData = new FormData(this);
        const frontEndData = {}; // 使用 frontEndData 表示前端数据
        for (let [key, value] of formData.entries()) {
            frontEndData[key] = value;
        }

        // 将表单数据转换为JSON格式
        const jsonData = JSON.stringify(frontEndData);

        // 发送POST请求到后端
        fetch('/play/play', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: jsonData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(backEndData => { // 使用 backEndData 表示后端返回的数据
            if (backEndData.Player && backEndData.responseData && backEndData.img) {
                // 拼接完整的图片URL
                const imageUrl = `http://150.158.2.43:8080/${backEndData.img}`;
                // 显示球员图片
                document.getElementById('playerImage').src = imageUrl;
            }
            console.log(backEndData); // 打印返回的数据
            alert('球员数据添加成功！');
        })
        .catch(error => {
            console.error('Error:', error);
            alert('无法加载球员数据，请检查网络连接或稍后重试。');
        });
    });
</script>
</html>


{{end}}
