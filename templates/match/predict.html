{{define "match/predict.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Club</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .navbar {
      background-color: #007bff;
    }
    .carousel-inner img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }
    .about, .news {
      background-color: #f8f9fa;
      padding: 2rem;
    }
    .news-item {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 1rem;
    }
    footer {
      background-color: #007bff;
      color: white;
    }
  </style>
<script>
    // 页面加载时动态设置Token
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token'); // 从localStorage读取Token
        if (token) {
            // 将Token添加到全局变量或隐藏字段中
            document.getElementById('token-field').value = token;
        } else {
            alert('Token不存在请先登录');
            window.location.href = '/index/login'; // 跳转到登录页面
        }
    });
</script>
</head>
<body>
  <!-- 头部导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="http://150.158.2.43:8080/index/index">
      <img src="logo.png" alt="Football Club Logo" height="30">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/index">主页</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/index">球员信息管理系统</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/play/index">球员能力分析</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/pre/predict">预测比赛</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/train/index">训练信息</a>
        </li>
      </ul>
    </div>
  </nav>
    <div class="container">
        <h1>Football Match Prediction</h1>
        <form id="predictionForm">
            <label for="teamName">Enter Team Name:</label>
            <input type="text" id="teamName" name="teamName" required>
            <button type="submit">Get Prediction</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const teamName = document.getElementById('teamName').value;
            console.log(teamName)
            const resultDiv = document.getElementById('result');
            const token = localStorage.getItem('token'); // 从localStorage读取Token
            if (!token) {
              console.error('Token不存在,请先登录');
              return;
            }
            
            console.log(JSON.stringify({ name:teamName }))
            try {
                const response = await fetch(`/pre/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // 设置Authorization头
                    },
                    body: JSON.stringify({ name:teamName })
                });
                const data = await response.json();
                console.log(data)


                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h2>Prediction Result</h2>
                        <p><strong>Winner:</strong> ${data.message.Winner.name}</p>
                        <p><strong>League:</strong> ${data.message.League.name}</p>
                        <p><strong>Home Team:</strong> ${data.message.Teams.Home.name}</p>
                        <p><strong>Away Team:</strong> ${data.message.Teams.Away.name}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p>Error: ${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
{{end}}
