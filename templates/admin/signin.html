{{define "admin/signin.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Club</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .navbar {
      background-color: #007bff;
    }
    .carousel-inner img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }
    .about, .news {
      background-color: #f8f9fa;
      padding: 2rem;
    }
    .news-item {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 1rem;
    }
    footer {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <!-- 头部导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="http://150.158.2.43:8080/index/index">
      <img src="logo.png" alt="Football Club Logo" height="30">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/index">主页</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/signin">注册</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/update">更新密码</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/signin">删除用户</a>
        </li>
      </ul>
    </div>
  </nav>  
  <div class="container">
    <h2>Register</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" name="username" required>
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" required>
      </div>
      <div class="form-group">
        <label for="registerIdentity">identity</label>
        <input type="text" id="registerIdentity" name="identity" required>
      </div>
      <button type="submit">Register</button>
      <p id="registerError" class="error"></p>
    </form>
  </div>

  <script>
    

    document.getElementById('registerForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const formData = new FormData(this);
        const data = {};
        formData.forEach((value, key) => {
          data[key] = value;   
        });

        // 将表单数据转换为JSON格式
        const jsonData = JSON.stringify(data);
        console.log(jsonData)

      fetch('/index/signin', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(response => {
        if (response.ok) {
          return response.json();
        } else if (response.status === 400) {
          throw new Error('Failed to register user');
        } else {
          throw new Error('An error occurred');
        }
      })
      .then(data => {
        if (data.token) {
          localStorage.setItem('token', data.token); // 保存Token
          console.log('登录成功,Token已保存');
      } else {
          console.error('登录失败');
      }
        window.location.href = '/index/index'; // 重定向到添加球员的表单页面
      })
      .catch(error => {
        document.getElementById('registerError').textContent = error.message;
      });
    });
  </script>
</body>
</html>
{{end}}
