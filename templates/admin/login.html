{{define "admin/login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Club</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .navbar {
      background-color: #007bff;
    }
    .carousel-inner img {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }
    .about, .news {
      background-color: #f8f9fa;
      padding: 2rem;
    }
    .news-item {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 1rem;
    }
    footer {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <!-- 头部导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="http://150.158.2.43:8080/index/index">
      <img src="logo.png" alt="Football Club Logo" height="30">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/index">主页</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/index">球员信息管理系统</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/play/index">球员能力分析</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/predict">预测比赛</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/train/index">训练信息</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/ai">AI问答</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit">Login</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>


  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      // 打印请求体
      const requestBody = JSON.stringify({ username, password });
      console.log('Request Body:', requestBody);

      fetch('/index/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: requestBody
      })
      .then(response => {
        if (response.ok) {
          return response.json();
        } else if (response.status === 401) {
          throw new Error('Invalid username or password');
        } else {
          throw new Error('An error occurred');
        }
      })
      .then(data => {
        alert('Login successful');
        console.log('Response Data:', data);

        // 登录成功后跳转到目标页面
        window.location.href = '/index/index'; // 修改为你的目标页面路径
      })
      .catch(error => {
        console.error('Error:', error); // 打印错误到控制台
        document.getElementById('loginError').textContent = error.message;
      });
    });
  </script>
</body>
</html>
{{end}}
