{{define "train/addTrain.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .navbar {
          background-color: #007bff;
        }
        .carousel-inner img {
          width: 100%;
          height: 400px;
          object-fit: cover;
        }
        .about, .news {
          background-color: #f8f9fa;
          padding: 2rem;
        }
        .news-item {
          background-color: white;
          border-radius: 8px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
          padding: 1rem;
        }
        .footer {
          background-color: #007bff;
          color: white;
        }
      </style>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="http://150.158.2.43:8080/index/index">
            <img src="logo.png" alt="Football Club Logo" height="30">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/index/index">主页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/club/index">球员信息管理系统</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/play/index">球员能力分析</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/predict">预测比赛</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/train/index">训练信息</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="http://150.158.2.43:8080/ai">AI问答</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <h1>Training Information</h1>
        <form id="trainForm">
            <label for="trainName">Training Name:</label>
            <input type="text" id="trainName" name="trainName" required>

            <label for="trainDate">Training Date:</label>
            <input type="date" id="trainDate" name="trainDate" required>

            <label for="trainContent">Training Content:</label>
            <textarea id="trainContent" name="trainContent" rows="4" required></textarea>

            <label for="trainIntensity">Training Intensity:</label>
            <input type="text" id="trainIntensity" name="trainIntensity" required>

            <label for="trainDuration">Training Duration (minutes):</label>
            <input type="number" id="trainDuration" name="trainDuration" required>

            <label for="trainInjury">Injury (Yes/No):</label>
            <input type="text" id="trainInjury" name="trainInjury" required>

            <button type="submit">Submit</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('trainForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const trainName = document.getElementById('trainName').value;
            const trainDate = document.getElementById('trainDate').value;
            const trainContent = document.getElementById('trainContent').value;
            const trainIntensity = document.getElementById('trainIntensity').value;
            const trainDuration = document.getElementById('trainDuration').value;
            const trainInjury = document.getElementById('trainInjury').value === 'Yes';
            const resultDiv = document.getElementById('result');

            try {
                const response = await fetch(`/train/add`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        Name: trainName,
                        Date: trainDate,
                        Content: trainContent,
                        Intensity: trainIntensity,
                        Duration: parseInt(trainDuration, 10),
                        Injury: trainInjury
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `<p>Message: ${data.message}</p>`;
                } else {
                    resultDiv.innerHTML = `<p>Error: ${data.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>

{{end}}
