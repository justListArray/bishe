{{define "member/searchAllMember.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Club</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  
  <script>
    // 页面加载时动态设置Token
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token'); // 从localStorage读取Token
        if (token) {
            // 将Token添加到全局变量或隐藏字段中
            document.getElementById('token-field').value = token;
        } else {
            alert('Token不存在请先登录');
            window.location.href = '/index/login'; // 跳转到登录页面
        }
    });
</script>
</head>
<body>
  <!-- 头部导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="http://150.158.2.43:8080/index/index">
      <img src="http://150.158.2.43:8080/static/image/logo.png" alt="Football Club Logo" height="30">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/index/index">主页</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/index">球员信息管理系统</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/add">增加球员</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/addTeam">增加球队球员</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/delete">删除球员</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/search">搜索球员</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="http://150.158.2.43:8080/club/all">列表全部球员</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h1>球员信息</h1>
    <div id="results">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>年龄</th>
          </tr>
        </thead>
        <tbody>
          {{range $id, $member := .Members}}
          <tr>
            <td>{{$id}}</td>
            <td>{{$member.Name}}</td>
            <td>{{$member.Age}}</td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
{{end}}
